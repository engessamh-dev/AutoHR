[workspace]
members = ["src-tauri"]
resolver = "2"

# Optimise dependencies (incl. the on-device document-detection model runtime) even in
# `tauri dev`; otherwise detection takes ~30 s per photo instead of ~2 s. The app crate
# itself stays unoptimised for fast rebuilds.
[profile.dev.package."*"]
opt-level = 3
