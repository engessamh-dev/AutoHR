[package]
name    = "autohr"
version = "1.0.4"
edition = "2021"

[package.metadata.bundle]
name              = "CNSArch"
identifier        = "com.autohr.app"
icon              = ["icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/icon.icns", "icons/icon.ico"]
copyright         = "Eng. Essam Al-Emaraa"
category          = "Business"
short_description = "HR & Document Management System"

[lib]
name       = "autohr_lib"
path       = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "autohr"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri               = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
rusqlite            = { version = "0.31", features = ["bundled", "backup"] }
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"
sha2                = "0.10"
hex                 = "0.4"
bcrypt              = "0.15"
chrono              = { version = "0.4", features = ["serde"] }
dirs                = "5"
thiserror           = "1"
rand                = "0.8"
aes-gcm             = "0.10"
argon2              = "0.5"
tempfile            = "3"
zip                 = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-notification = "2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
imageproc = { version = "0.27.0", default-features = false }
# Pure-Rust ONNX inference for the bundled on-device document detector (no DLL, no network).
tract-onnx = "0.21"
tauri-plugin-updater = "2"
